name: TMDb discovery probe
# Phase B discovery only (FILM-TV-SPEC B1): prints findings to the log,
# touches no data, commits nothing. Dispatch by hand.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python collector/discover_tmdb.py
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
