name: Collect releases
on:
  schedule:
    - cron: 0 10 * * *   # 06:00 ET during DST, 05:00 in winter
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r collector/requirements.txt
      - run: python collector/split_tracks.py   # one-time tracklist split; no-op once migrated
      - run: python collector/collect.py
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - run: |
          git config user.name vgm-bot
          git config user.email actions@users.noreply.github.com
          git add data
          git diff --cached --quiet || (git commit -m collect && git pull --rebase && git push)
