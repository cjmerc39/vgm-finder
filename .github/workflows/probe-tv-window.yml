name: TV window probe
# MATCHER-FIX-SPEC Phase 3, item 1. Read-only: prints what TMDb supports
# for finding recent seasons, touches no data, commits nothing.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r collector/requirements.txt
      - run: python collector/probe_tv_window.py
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
