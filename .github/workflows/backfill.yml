name: Backfill classics
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r collector/requirements.txt
      - run: python collector/backfill.py
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      - run: |
          git config user.name vgm-bot
          git config user.email actions@users.noreply.github.com
          git add data/releases.json collector/backfill-state.json
          git diff --cached --quiet || (git commit -m backfill && git push)
