name: Mood tags backfill
# Dispatch by hand until the run reports "moods complete". Tags untagged
# albums with a tracklist, newest first, capped per run; the untagged set
# is the cursor and collector/moods-state.json keeps every run's spend. A
# small cap makes a hand-check sample.
on:
  workflow_dispatch:
    inputs:
      cap:
        description: albums to tag this run
        default: "500"
        required: true
      workers:
        description: parallel requests
        default: "4"
        required: true
permissions:
  contents: write
concurrency:
  group: moods
  cancel-in-progress: false
jobs:
  moods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r collector/requirements.txt
      - run: python collector/moods.py backfill --cap "${{ github.event.inputs.cap }}" --workers "${{ github.event.inputs.workers }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name vgm-bot
          git config user.email actions@users.noreply.github.com
          git add data collector/moods-state.json
          git diff --cached --quiet || (git commit -m "mood tags" && git pull --rebase && git push)
