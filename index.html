<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scorekeep</title>
<meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e14; --bg2:#10141d; --bg3:#151b27; --line:#212837;
  --ink:#f0e9d6; --mut:#8e97a8; --dim:#5b6474;
  --amber:#f5a83c; --amber2:#ffc878; --amberdim:#7d5a24;
  --disp:'Silkscreen',ui-monospace,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* locked horizontally; touch-action kills double-tap zoom while pinch still works */
html{height:100%;background:var(--bg);touch-action:manipulation;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);height:100%;display:flex;flex-direction:column;overflow:hidden;touch-action:manipulation}
@supports (height:100dvh){body{height:100dvh}}
@media (display-mode: standalone){
  @supports (height:100lvh){body{height:100lvh}}
}
/* faint phosphor wash + vignette; static, so reduced-motion needs no exception */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 80% at 50% 0%, rgba(245,168,60,.05), transparent 55%),
             radial-gradient(140% 120% at 50% 112%, rgba(0,0,0,.55), transparent 60%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:4px}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%} /* 16px floor: iOS auto-zooms focused inputs below 16px */
input:focus{outline:1px solid var(--amberdim)}
::placeholder{color:var(--dim)}

#topbar{flex:none;width:100%;max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 4px;display:flex;align-items:baseline;gap:10px;flex-wrap:nowrap}
#topbar h1{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:1px;color:var(--amber2);
  text-shadow:0 0 14px rgba(245,168,60,.35)}
#topbar .sub{color:var(--dim);font-size:10.5px;letter-spacing:3px;text-transform:uppercase}
#hrandom{margin-left:auto;flex:none;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:6px 13px;white-space:nowrap}
#hrandom:active{color:var(--amber2);border-color:var(--amberdim)}

#controls{flex:none;width:100%;max-width:560px;margin:0 auto;padding:8px 16px 10px;border-bottom:1px solid var(--line)}
#qwrap{position:relative}
#qwrap input{padding-right:42px}
#qclear{display:none;position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;color:var(--dim);font-size:14px}
#qwrap.has #qclear{display:block}
#subctl{display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
#subctl:not(:empty){margin-top:8px}
#subctl button{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);
  border:1px solid var(--line);border-radius:99px;padding:6px 13px}
#subctl button.on{color:var(--amber2);border-color:var(--amberdim)}

main{position:relative;z-index:1;width:100%;max-width:560px;margin:0 auto;flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 8px 20px}

.row{display:flex;align-items:stretch;gap:10px;border-bottom:1px solid var(--line);padding:10px 4px 10px 8px;cursor:pointer}
.row:active{background:var(--bg2)}
.rart{flex:none;width:54px;height:54px;border-radius:8px;overflow:hidden;background:var(--bg3);border:1px solid var(--line);align-self:flex-start;margin-top:2px;position:relative}
.rart img{width:100%;height:100%;object-fit:cover;display:block}
.rart.noart::after{content:'▷';position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:18px}
.row.ghost .rart,.row.heard .rart{opacity:.5}
.rmain{flex:1;min-width:0}
.rtop{display:flex;align-items:baseline;gap:8px}
.tno{font-family:var(--disp);font-size:10.5px;letter-spacing:.5px;color:var(--amber);white-space:nowrap}
.new{font-size:8.5px;font-weight:700;letter-spacing:1.5px;color:var(--bg);background:var(--amber);border-radius:3px;padding:1.5px 5px 1px}
.rtop time{margin-left:auto;color:var(--dim);font-size:10.5px;letter-spacing:1px;white-space:nowrap}
.rtitle{margin-top:3px;font-size:15px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.rsub{margin-top:2px;color:var(--mut);font-size:12.5px;overflow-wrap:anywhere}
.rnote{margin-top:4px;color:var(--mut);font-size:12.5px;font-style:italic;overflow-wrap:anywhere}
.rmeta{margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{font-size:10px;letter-spacing:.8px;text-transform:lowercase;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.chip.community{border-style:dashed;color:var(--dim)}
.minis{color:var(--amber);font-size:12px;letter-spacing:1px;white-space:nowrap}
/* one aligned control bar per row: chips left, actions right, nothing floats */
.rbar{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.racts{margin-left:auto;display:flex;gap:5px}
.racts button{width:42px;height:38px;font-size:17px;color:var(--mut);border:1px solid var(--line);border-radius:9px;display:grid;place-items:center}
.racts .queue.on{color:var(--amber2);border-color:var(--amberdim)}
.racts .like.on{color:var(--amber2);border-color:var(--amberdim)}
.racts .log.on{color:var(--amber);border-color:var(--amberdim)}
.racts .hide{color:var(--dim)}
.row.heard .rmain{opacity:.55}
.row.heard .rtitle{color:var(--mut);font-weight:500}
@media (prefers-reduced-motion: no-preference){
  .row{transition:background .15s}
  .racts button{transition:color .15s,transform .12s}
  .racts button:active{transform:scale(1.25)}
}

.yhead{font-family:var(--disp);font-size:10.5px;color:var(--dim);letter-spacing:1px;padding:20px 8px 6px;border-bottom:1px solid var(--line)}
.row[aria-expanded="true"]{background:var(--bg2)}
.rx{margin-top:10px;border-top:1px dashed var(--line);padding-top:12px;cursor:default}
.xlisten{display:block;width:100%;background:var(--amber);color:#241a08;font-weight:700;letter-spacing:1.5px;border-radius:10px;padding:12px;font-size:12.5px;text-align:center}
.xinfo{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin-top:11px;font-size:12.5px}
.xk{color:var(--dim);text-transform:uppercase;letter-spacing:1.2px;font-size:9.5px;padding-top:3px}
.xv{color:var(--mut);overflow-wrap:anywhere}
.xh{font-family:var(--disp);font-size:10px;color:var(--amber);letter-spacing:1px;margin:13px 0 5px}
.xtrack{display:flex;gap:9px;align-items:center;font-size:13px;padding:1px 0}
.xplays{color:var(--dim);font-size:11px;white-space:nowrap}
.xend{margin-left:auto;display:flex;align-items:center;gap:4px}
.tlike{flex:none;width:38px;height:36px;font-size:15px;color:var(--dim);display:grid;place-items:center;border-radius:8px}
.tlike.on{color:var(--amber2)}
@media (prefers-reduced-motion: no-preference){
  .tlike{transition:color .15s,transform .12s}
  .tlike:active{transform:scale(1.25)}
}
.xlinks{display:flex;gap:6px;flex-wrap:wrap}
a.xsrc{text-decoration:none}
.mchip{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;font-size:11px;color:var(--amber2);border-color:var(--amberdim)}
.mchip:active{background:var(--bg3)}
.xmoods{display:flex;gap:6px;flex-wrap:wrap}
#moodbar{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--line)}
#moodbar .mlabel{font-family:var(--disp);font-size:10.5px;letter-spacing:1px;color:var(--amber)}
#moodbar .mn{color:var(--dim);font-size:11px}
#moodclear{margin-left:auto;color:var(--amber);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;border:1px solid var(--amberdim);border-radius:9px;padding:7px 12px}
.state{padding:48px 16px;text-align:center;color:var(--mut)}
.state .big{font-family:var(--disp);font-size:13px;letter-spacing:1px;color:var(--amber);margin-bottom:12px}
.state p{max-width:34ch;margin:0 auto;line-height:1.6}

#hidhead{font-family:var(--disp);font-size:10.5px;color:var(--dim);letter-spacing:1px;padding:22px 8px 6px;border-bottom:1px solid var(--line)}
.row.ghost .rmain{opacity:.45}
.restore{color:var(--amber);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;border:1px solid var(--amberdim);border-radius:9px;padding:9px 14px}

#colophon{padding:18px 8px 6px;color:var(--dim);font-size:11px;letter-spacing:.5px;line-height:2}
#colophon button,#colophon label{color:var(--mut);text-decoration:underline;text-underline-offset:2px;padding:2px 2px;cursor:pointer;font-size:11px;letter-spacing:.5px}
#colophon .impmsg{color:var(--amber)}

#totop{position:fixed;right:14px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:6;
  background:var(--bg2);border:1px solid var(--amberdim);color:var(--amber);border-radius:99px;
  padding:10px 15px;font-family:var(--disp);font-size:10px;letter-spacing:1.5px;
  box-shadow:0 6px 22px rgba(0,0,0,.55)}
#totop[hidden]{display:none}

#tabbar{flex:none;width:100%;background:rgba(9,11,17,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabbar .trow{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
#tabbar button{padding:13px 4px 12px;color:var(--dim);font-size:11.5px;letter-spacing:1.8px;text-transform:uppercase}
#tabbar button .n{color:var(--dim);margin-left:5px;font-size:10.5px}
#tabbar button.on{color:var(--amber2)}
#tabbar button.on span.lbl{border-bottom:2px solid var(--amber);padding-bottom:4px}
#tabbar button.on .n{color:var(--amberdim)}
#tabbar .nb{margin-left:5px;font-size:8.5px;font-weight:700;letter-spacing:1px;color:var(--bg);background:var(--amber);border-radius:3px;padding:1.5px 4px 1px;vertical-align:2px}

/* the album page */
#albumwrap:empty{display:none}
#album{position:fixed;inset:0;z-index:7;background:var(--bg);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
#album .ahead{position:sticky;top:0;background:rgba(9,11,17,.96);display:flex;align-items:center;
  padding:calc(10px + env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line);z-index:1}
#album .aclose{width:44px;height:40px;font-size:18px;color:var(--mut)}
#album .ahead .tno{margin-left:4px}
#album .abody{max-width:560px;margin:0 auto;padding:22px 18px calc(30px + env(safe-area-inset-bottom))}
#album .aart{width:min(62vw,260px);height:min(62vw,260px);margin:0 auto;border-radius:14px;overflow:hidden;
  background:var(--bg3);border:1px solid var(--line);position:relative;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#album .aart img{width:100%;height:100%;object-fit:cover;display:block}
#album .aart.noart::after{content:'▷';position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:44px}
#album .atitle{margin-top:18px;text-align:center;font-size:17px;font-weight:600;overflow-wrap:anywhere}
#album .asub{margin-top:5px;text-align:center;color:var(--mut);font-size:13px;overflow-wrap:anywhere}
#album .ameta{margin-top:3px;text-align:center;color:var(--dim);font-size:11.5px;letter-spacing:.5px}
#album .alist{margin-top:22px}
#album .amoods{margin-top:12px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.atrack{display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.atrack:active{background:var(--bg2)}
.atrack .tix{font-family:var(--disp);font-size:10px;color:var(--dim);min-width:22px}
.atrack .ttl{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.atrack .medal{font-family:var(--disp);font-size:10px;color:var(--bg);background:var(--amber);border-radius:4px;padding:2px 6px}
.atrack .tplays{color:var(--dim);font-size:11px;white-space:nowrap}
.xall{margin-top:12px;display:block;width:100%;text-align:center;color:var(--amber);font-size:11.5px;
  letter-spacing:1.6px;text-transform:uppercase;border:1px solid var(--amberdim);border-radius:10px;padding:11px}

/* liked-song rows: tighter than release rows, tap = play */
.row.song .rart{width:44px;height:44px}
.row.song .rtitle{margin-top:0;font-size:14px}
.row.song .racts{align-items:center}
.row.song .racts button{width:40px;height:36px;font-size:15px}

/* playlist builder cards */
.plcard{border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin:10px 0;cursor:pointer}
.plcard .plname{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.plcard .plmeta{color:var(--dim);font-size:11px;letter-spacing:.8px;text-transform:uppercase;margin-top:3px}
.plx{margin-top:10px;color:var(--amber);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;
  border:1px solid var(--amberdim);border-radius:9px;padding:9px 15px}
.plx[disabled]{color:var(--dim);border-color:var(--line);cursor:default}
.pltracks{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.pltrack{display:flex;gap:8px;align-items:baseline;font-size:12.5px;padding:2px 0;color:var(--mut)}
.pltrack .g{flex:none;max-width:38%;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pltrack .t{overflow-wrap:anywhere}
.plhint{padding:14px 8px 4px;color:var(--dim);font-size:11.5px;line-height:1.7}
.plhint code{color:var(--mut);font-size:11px}
.pubrow{display:flex;gap:8px;margin:9px 0 3px}
.pubrow input{flex:1;min-width:0;background:none;border:1px solid var(--line);border-radius:9px;color:var(--mut);padding:8px 11px;font:inherit;font-size:12px}
.pubrow button,#pubclear{color:var(--amber);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;border:1px solid var(--amberdim);border-radius:9px;padding:9px 15px}

/* custom playlists: save-to picker, snackbar, library section */
.tadd{flex:none;width:34px;height:36px;font-size:17px;color:var(--dim);display:grid;place-items:center;border-radius:8px}
.tadd:active{color:var(--amber)}
#cplhead,#cplhead2{font-family:var(--disp);font-size:10px;letter-spacing:2px;color:var(--dim);padding:14px 4px 2px}
#cplnew,#rcpnew{display:block;width:100%;text-align:center;color:var(--amber);font-size:11px;letter-spacing:1.6px;
  text-transform:uppercase;border:1px dashed var(--amberdim);border-radius:12px;padding:12px;margin:10px 0}
.pltrack .cprm{flex:none;margin-left:auto;width:32px;height:30px;color:var(--dim);font-size:12px}
.cprow{display:flex;width:100%;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);
  color:var(--mut);font-size:14px}
.cprow .cpname{flex:1;min-width:0;text-align:left;overflow-wrap:anywhere}
.cprow .cpn{font-family:var(--disp);font-size:10px;color:var(--dim)}
#toastwrap{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));display:flex;
  justify-content:center;z-index:9;pointer-events:none}
#toast{display:flex;align-items:center;gap:12px;max-width:86vw;background:var(--bg2);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;font-size:12.5px;color:var(--mut);box-shadow:0 6px 24px rgba(0,0,0,.5);pointer-events:auto}
#toast button{color:var(--amber);font-size:11px;letter-spacing:1.2px;text-transform:uppercase}

/* the logging ritual sheet */
#scrim{position:fixed;inset:0;background:rgba(4,5,9,.6);z-index:8}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;max-width:560px;margin:0 auto;
  background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;
  padding:16px 18px calc(18px + env(safe-area-inset-bottom))}
@media (prefers-reduced-motion: no-preference){
  #sheet{animation:sheetUp .22s cubic-bezier(.2,.7,.3,1)}
  @keyframes sheetUp{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
}
#sheet .shead{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
#sheet .stitle{font-weight:600;font-size:15px;overflow-wrap:anywhere}
#sheet .slab{color:var(--dim);font-size:10.5px;letter-spacing:2px;text-transform:uppercase;margin:12px 0 6px;display:flex;align-items:baseline;gap:10px}
#sh-clear{color:var(--mut);font-size:10.5px;letter-spacing:1px;text-decoration:underline;text-underline-offset:2px}
#sh-stars{display:flex;gap:6px}
.star{position:relative;width:40px;height:40px}
.sbase,.sfill{position:absolute;inset:0;font-size:30px;line-height:40px;text-align:left;pointer-events:none}
.sbase{color:var(--bg3);-webkit-text-stroke:1px var(--dim)}
.sfill{color:var(--amber);overflow:hidden;white-space:nowrap}
.star button{position:absolute;top:0;bottom:0;width:50%;background:transparent}
.star button.hl{left:0}.star button.hr{right:0}
#sheet .srow{display:flex;gap:10px;align-items:center;margin-top:4px}
#sh-heart{flex:none;width:44px;height:44px;font-size:22px;color:var(--dim);border:1px solid var(--line);border-radius:10px}
#sh-heart.on{color:var(--amber2);border-color:var(--amberdim)}
#sheet .sactions{display:flex;align-items:center;gap:14px;margin-top:16px}
#sh-save{background:var(--amber);color:#241a08;font-weight:700;letter-spacing:2px;border-radius:10px;padding:12px 26px;font-size:13px}
#sh-unlog{color:var(--dim);font-size:11px;letter-spacing:.5px;text-decoration:underline;text-underline-offset:2px}

/* control sheets: the picker sheet, parameterised (sorts, filters, years) */
#sheet.ctrl{max-height:70vh;display:flex;flex-direction:column}
#sheet .shbody{overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.shrow{display:flex;width:100%;align-items:center;gap:10px;min-height:44px;padding:10px 4px;
  border-bottom:1px solid var(--line);color:var(--mut);font-size:14px}
.shrow:active{background:var(--bg3)}
.shrow .shl{flex:1;min-width:0;text-align:left;overflow-wrap:anywhere}
.shrow .shr{color:var(--dim);font-size:12px;white-space:nowrap}
.shrow[disabled]{opacity:.45}
.shseg{display:flex;gap:6px;margin:4px 0 8px}
.shseg button{flex:1;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);
  border:1px solid var(--line);border-radius:99px;padding:9px 4px}
.shseg button.on{color:var(--amber2);border-color:var(--amberdim)}
.shseg button[disabled]{opacity:.45}
.shnote{color:var(--dim);font-size:11px;margin:2px 0 8px}
.shfoot{display:flex;justify-content:space-between;margin-top:12px;flex:none}
.shfoot button{color:var(--amber);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;
  border:1px solid var(--amberdim);border-radius:9px;padding:9px 15px}
#subctl .fchip{flex-shrink:1000}  /* the label chip gives way first; sort and year stay whole */

/* the recipe sheet: full height, a live count on top, typed fields between the segments */
#sheet.ctrl.tall{max-height:calc(100vh - 48px)}
@supports (height:100dvh){#sheet.ctrl.tall{max-height:calc(100dvh - 48px)}}
.rcount{font-family:var(--disp);font-size:10.5px;letter-spacing:1px;color:var(--amber);padding:2px 0 10px}
#sheet.ctrl .shbody input{margin:2px 0}
.shyears{display:flex;gap:10px;align-items:center;color:var(--dim);font-size:12px}
.shyears input{flex:1;min-width:0;text-align:center}

/* the random mix's limit row: presets plus a typed number */
.mixlimit{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px}
.mixlimit .mixl{color:var(--dim);font-size:10.5px;letter-spacing:2px;margin-right:4px}
.mixp{font-size:11px;letter-spacing:1.2px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:8px 12px}
.mixp.on{color:var(--amber2);border-color:var(--amberdim)}
#mixlimit{width:64px;flex:none;text-align:center;padding:7px 8px}
</style>
</head>
<body>
<header id="topbar">
  <h1>SCOREKEEP</h1>
  <span class="sub">Sound Test</span>

<div id="toastwrap"></div>
<script>
/* ============================ state ============================ */
const KEY = 'vgm-v1';
const VIEWS = ['feed', 'queue', 'library'];
const STATUSES = ['unsorted', 'queued', 'listened', 'hidden'];
const LIB_SORTS = ['listenedOn', 'rating', 'date'];
const LIB_VIEWS = ['albums', 'songs', 'playlists'];
const FEED_SORTS = ['date', 'oldest', 'az', 'added', 'plays'];
const MEDIUMS = ['all', 'game', 'screen', 'film', 'tv'];  // screen = film + tv together
/* saved recipes: rules, never tracks. A recipe is re-evaluated on every
   render, so a fresh rating or heart changes what it produces. */
const RECIPE_SOURCES = ['catalog', 'library', 'queue'];   // library = anything rated or logged
const RECIPE_RATINGS = ['any', '3', '4', '5'];            // any | 3★+ | 4★+ | 5★
const RECIPE_PICKS = ['all', 'top', 'hearted'];           // every track | top N by plays | ♥ tracks
const RECIPE_ORDERS = ['plays', 'album', 'newest', 'shuffle'];
const RECIPE_LIMITS = [20, 50, 100, 200];
const RECIPE_MAX = 200;
// the mood vocabulary in collector/moods.json's order (a test holds the two together)
const MOODS = ['wonder', 'transcendent', 'nostalgic', 'tender', 'peaceful', 'joyful', 'powerful', 'tense',
               'sad', 'heroic', 'eerie', 'driving', 'playful', 'mournful', 'romantic', 'mysterious'];
function recipeBlank(){
  return { id: '', name: '', source: 'catalog', medium: 'all', genre: { game: 'all', screen: 'all' },
           yearFrom: '', yearTo: '', composer: '', rating: 'any', hearted: false, co: 'all', console: false,
           scores: false, moods: [], pick: 'all', topN: 3, limit: 50, order: 'plays' };  // scores: skip songsAlbum rows; moods: any of these
}
function validRecipe(x, ids){
  if(!x || typeof x !== 'object' || typeof x.id !== 'string' || !x.id || ids.has(x.id)) return null;
  const b = recipeBlank();
  b.id = x.id;
  b.name = typeof x.name === 'string' ? x.name.trim().slice(0, 80) : '';  // blank = the generated name
  b.source = RECIPE_SOURCES.includes(x.source) ? x.source : 'catalog';
  b.medium = MEDIUMS.includes(x.medium) ? x.medium : 'all';
  b.genre = genreState(x.genre);
  b.yearFrom = typeof x.yearFrom === 'string' && /^\d{4}$/.test(x.yearFrom) ? x.yearFrom : '';
  b.yearTo = typeof x.yearTo === 'string' && /^\d{4}$/.test(x.yearTo) ? x.yearTo : '';
  b.composer = typeof x.composer === 'string' ? x.composer.trim().slice(0, 80) : '';
  b.rating = RECIPE_RATINGS.includes(x.rating) ? x.rating : 'any';
  b.hearted = x.hearted === true;
  b.co = ['all', 'big', 'indie'].includes(x.co) ? x.co : 'all';
  b.console = x.console === true;
  b.scores = x.scores === true;
  b.moods = Array.isArray(x.moods) ? MOODS.filter(m => x.moods.includes(m)) : [];  // vocabulary order, unknown words dropped
  b.pick = RECIPE_PICKS.includes(x.pick) ? x.pick : 'all';
  b.topN = Number.isInteger(x.topN) && x.topN >= 1 && x.topN <= 5 ? x.topN : 3;
  b.limit = Number.isInteger(x.limit) && x.limit >= 1 && x.limit <= RECIPE_MAX ? x.limit : 50;
  b.order = RECIPE_ORDERS.includes(x.order) ? x.order : 'plays';
  return b;
}
let R = { updatedAt: null, releases: [] };   // shared data from the collector; never written here
let LOADSTATE = 'loading';                    // loading | ok | empty | error
let LOADERR = '';
let TRACKNO = {};                             // id -> position in the append-only history
let Q = '';                                   // search text, deliberately not persisted
let FMOOD = '';                               // the feed's mood from a tapped chip: session only, like the search
let SHEET = null;                             // {id, draft} while the logging sheet is open
let CPICK = null;                             // {rid, t, from?} save-to-playlist picker, or {create:true} from the library
let CSHEET = null;                            // which control sheet is open: feedsort | filters | year | libsort | plyear | plgenre | recipe | rgenre
let RDRAFT = null;                            // {id|null, rec} while the recipe sheet is open; id set = editing
let PLGBUCKET = 'game';                       // which medium's genre the playlists picker (plgpick) is showing
let RSEED = {};                               // playlist key -> shuffle seed for this session; reshuffle replaces it
let TOAST = null;                             // {msg, song?} transient snackbar
let TOAST_TIMER = 0;
let CPLDEL = null;                            // playlist key armed for delete (two-tap, no native confirm)
let IMPMSG = '';                              // one-shot import feedback line
let EXPANDED = null;                          // id of the row opened into its detail panel
let ALBUM = null;                             // id of the row opened into the full album page
let PLOPEN = null;                            // key of the playlist card opened into its preview
let BYID = {};                                // id -> release, built once at boot
let BASE = [];                                // the shared newest-first order, sorted once at boot
let TRACKS = {};                              // id -> tracklist fetched from data/tracks/<id>.json
let TLOAD = {};                               // id -> 'loading' | 'error', the fetch status a render can show
let TPEND = {};                               // id -> in-flight fetch promise, so later callers await it
let TRK_TIMER = 0;                            // collapses a burst of tracklist arrivals into one render
const PAGE = 60;                              // rows rendered per page of any list
let PAGE_N = 1;                               // pages currently shown
let PAGE_KEY = '';                            // list identity; paging resets when it changes
let MORE_IO = null;                           // IntersectionObserver on the MORE sentinel
const STANDALONE = (window.matchMedia && matchMedia('(display-mode: standalone)').matches)
  || window.navigator.standalone === true;
const BIG_STUDIOS = ['nintendo','sony','playstation','capcom','square enix','squaresoft','sega',
  'electronic arts','ea sports','ubisoft','activision','blizzard','microsoft','xbox','bandai namco',
  'namco','konami','rockstar','take-two','2k games','cd projekt','bethesda','valve','epic games',
  'fromsoftware','atlus','koei tecmo','naughty dog','insomniac','santa monica','guerrilla','bungie',
  'id software','respawn','infinity ward','treyarch'];
function mediumOf(r){ return r.medium || 'game'; }
function mediumMatches(sel, r){
  const m = mediumOf(r);
  if(sel === 'all') return true;
  if(sel === 'screen') return m === 'film' || m === 'tv';
  return m === sel;
}
function screenish(sel){ return sel === 'screen' || sel === 'film' || sel === 'tv'; }
function coTier(r){
  if(mediumOf(r) !== 'game') return null;  // Sony Pictures is not a game studio
  if(!r.company) return null;
  const c = r.company.toLowerCase();
  return BIG_STUDIOS.some(b => c.includes(b)) ? 'big' : 'indie';
}

function blank(){ return { status:'unsorted', rating:null, liked:false, note:'', listenedOn:null, queuedOn:null, likedTracks:[] }; }
function isBlank(e){ return e.status === 'unsorted' && e.rating == null && !e.liked && !e.note && !e.listenedOn && !(e.likedTracks || []).length; }
function validRating(r){ return typeof r === 'number' && r >= 0.5 && r <= 5 && Math.round(r * 2) === r * 2; }
function isDateStr(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
/* The version stays 3 on purpose. Genre picks are now keyed by medium,
   but the shape is backward tolerable: a v3 build reads the object, fails
   its typeof string check, and falls back to "all" without losing a single
   diary entry. Bumping would make a briefly-cached v3 page reject this
   state and overwrite it with a blank one, which costs the queue, the
   library, and every custom playlist. */
function fresh(){ return { v:3, entries:{}, lastSeen:0, view:'feed', feedSort:'date', feedCo:'all', feedConsole:false, feedGenre:{ game:'all', screen:'all' }, feedMedium:'all', libSort:'listenedOn', libLiked:false, libView:'albums', libMedium:'all', plYear:'all', plGenre:{ game:'all', screen:'all' }, showHidden:false, cpls:[], cplLast:null, recipes:[], mixScores:true, mixLimit:30, feedScores:false, libScores:false }; }
function genreState(v, hint){
  // hint routes a legacy single value into the bucket it actually came
  // from: the old feed sheet scoped its list by medium, the old playlists
  // sheet merged both vocabularies, so that one lands in both buckets
  if(v && typeof v === 'object' && !Array.isArray(v)){
    return { game: typeof v.game === 'string' && v.game ? v.game : 'all',
             screen: typeof v.screen === 'string' && v.screen ? v.screen : 'all' };
  }
  const one = typeof v === 'string' && v ? v : 'all';
  if(one === 'all') return { game: 'all', screen: 'all' };
  if(hint === 'screen') return { game: 'all', screen: one };
  if(hint === 'both') return { game: one, screen: one };
  return { game: one, screen: 'all' };
}

function migrateV1(d){
  // one-time v1 -> v2: starred becomes liked, listened becomes a dateless
  // diary entry, hidden stays hidden (and wins if a row was somehow both)
  const s = fresh();
  s.lastSeen = typeof d.lastSeen === 'number' ? d.lastSeen : 0;
  const ids = k => (d[k] && typeof d[k] === 'object' && !Array.isArray(d[k])) ? Object.keys(d[k]) : [];
  const ent = id => s.entries[id] || (s.entries[id] = blank());
  for(const id of ids('listened')) ent(id).status = 'listened';
  for(const id of ids('hidden')) ent(id).status = 'hidden';
  for(const id of ids('starred')) ent(id).liked = true;
  return s;
}

function validateState(d){
  if(!d || typeof d !== 'object') return null;
  if(d.v === 1) return migrateV1(d);
  if(d.v !== 2 && d.v !== 3) return null;  // v2 predates the medium fields: defaults fill in
  const s = fresh();
  s.lastSeen = typeof d.lastSeen === 'number' ? d.lastSeen : 0;
  s.view = VIEWS.includes(d.view) ? d.view : 'feed';
  s.feedSort = FEED_SORTS.includes(d.feedSort) ? d.feedSort : 'date';
  s.feedCo = ['all', 'big', 'indie'].includes(d.feedCo) ? d.feedCo : 'all';
  s.feedConsole = d.feedConsole === true;
  s.feedMedium = MEDIUMS.includes(d.feedMedium) ? d.feedMedium : 'all';
  s.feedGenre = genreState(d.feedGenre, screenish(s.feedMedium) ? 'screen' : 'game');
  s.libMedium = MEDIUMS.includes(d.libMedium) ? d.libMedium : 'all';
  s.libSort = LIB_SORTS.includes(d.libSort) ? d.libSort : 'listenedOn';
  s.libLiked = d.libLiked === true;
  s.libView = LIB_VIEWS.includes(d.libView) ? d.libView : 'albums';
  s.plYear = typeof d.plYear === 'string' && /^\d{4}$/.test(d.plYear) ? d.plYear : 'all';
  s.plGenre = genreState(d.plGenre, 'both');  // the old playlists list merged both vocabularies
  s.showHidden = d.showHidden === true;
  const src = (d.entries && typeof d.entries === 'object' && !Array.isArray(d.entries)) ? d.entries : {};
  for(const id in src){
    const x = src[id] || {}, e = blank();
    e.status = STATUSES.includes(x.status) ? x.status : 'unsorted';
    e.rating = validRating(x.rating) ? x.rating : null;
    e.liked = x.liked === true;
    e.note = typeof x.note === 'string' ? x.note.slice(0, 200) : '';
    e.listenedOn = isDateStr(x.listenedOn) ? x.listenedOn : null;
    e.queuedOn = isDateStr(x.queuedOn) ? x.queuedOn : null;
    if(Array.isArray(x.likedTracks)){
      const seen = new Set();
      for(const t of x.likedTracks){
        if(typeof t !== 'string' || !t) continue;
        const f = fold(t);
        if(seen.has(f)) continue;
        seen.add(f);
        e.likedTracks.push(t.slice(0, 300));
      }
    }
    if(!isBlank(e)) s.entries[id] = e;
  }
  if(Array.isArray(d.cpls)){
    const ids = new Set();
    for(const x of d.cpls){
      if(!x || typeof x !== 'object' || typeof x.id !== 'string' || !x.id || ids.has(x.id)) continue;
      const name = typeof x.name === 'string' ? x.name.trim().slice(0, 80) : '';
      if(!name) continue;
      ids.add(x.id);
      const p = { id: x.id, name, at: typeof x.at === 'number' ? x.at : 0, tracks: [] };
      const seen = new Set();
      if(Array.isArray(x.tracks)) for(const t of x.tracks){
        if(!t || typeof t.id !== 'string' || !t.id || typeof t.t !== 'string' || !t.t) continue;
        const k = t.id + '\n' + fold(t.t);
        if(seen.has(k)) continue;
        seen.add(k);
        p.tracks.push({ id: t.id, t: t.t.slice(0, 300) });
      }
      s.cpls.push(p);
    }
  }
  if(d.cplLast && typeof d.cplLast === 'object' && typeof d.cplLast.id === 'string'
     && typeof d.cplLast.at === 'number' && s.cpls.some(p => p.id === d.cplLast.id))
    s.cplLast = { id: d.cplLast.id, at: d.cplLast.at };
  s.mixScores = d.mixScores !== false;  // the random mix skips songs unless switched off
  s.mixLimit = Number.isInteger(d.mixLimit) && d.mixLimit >= 1 && d.mixLimit <= RECIPE_MAX ? d.mixLimit : 30;
  s.feedScores = d.feedScores === true;
  s.libScores = d.libScores === true;
  if(Array.isArray(d.recipes)){  // absent in older backups: they import with none, nothing else changes
    const ids = new Set();
    for(const x of d.recipes){
      const rc = validRecipe(x, ids);
      if(rc){ ids.add(rc.id); s.recipes.push(rc); }
    }
  }
  return s;
}

function load(){
  let raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){}
  if(!raw) return fresh();
  let d = null;
  try{ d = JSON.parse(raw); }catch(e){}
  const s = validateState(d);
  if(s) return s;
  try{ localStorage.setItem(KEY + '-backup', raw); }catch(e){}  // unknown schema: keep a copy, start clean
  return s || fresh();
}
let S = load();
const PREV_SEEN = S.lastSeen;   // frozen at boot: "new since last visit" compares against the previous visit
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
save();  // persists a v1 migration immediately, retiring the legacy fields

/* ========================== mutations ========================== */
/* every state change goes through one of these; no render path mutates */
function E(id){ return S.entries[id] || blank(); }
function editEntry(id, fn){
  const e = S.entries[id] || (S.entries[id] = blank());
  fn(e);
  if(isBlank(e)) delete S.entries[id];
  save(); renderAll();
}
function setView(v){ if(VIEWS.includes(v)){ S.view = v; CSHEET = null; save(); ensureViewTracks(); renderAll(); } }
function setFeedMedium(m){ if(MEDIUMS.includes(m)){ S.feedMedium = m; save(); renderAll(); } }
function setLibMedium(m){ if(MEDIUMS.includes(m)){ S.libMedium = m; save(); renderAll(); } }
function setLibSort(k){ if(LIB_SORTS.includes(k)){ S.libSort = k; save(); renderAll(); } }
function setFeedSort(k){ if(FEED_SORTS.includes(k)){ S.feedSort = k; save(); renderAll(); } }
function setFeedCo(k){ if(['all', 'big', 'indie'].includes(k)){ S.feedCo = k; save(); renderAll(); } }
function toggleFeedConsole(){ S.feedConsole = !S.feedConsole; save(); renderAll(); }
function setFeedGenre(bucket, g){
  if(bucket !== 'game' && bucket !== 'screen') return;
  S.feedGenre[bucket] = g || 'all';
  save(); renderAll();
}
function clearFeedFilters(){
  S.feedCo = 'all'; S.feedConsole = false;
  S.feedGenre = { game: 'all', screen: 'all' };
  S.feedMedium = 'all'; S.feedScores = false;
  save(); renderAll();
}
function toggleFeedScores(){ S.feedScores = !S.feedScores; save(); renderAll(); }
function toggleLibScores(){ S.libScores = !S.libScores; save(); renderAll(); }
function setMixLimit(n){
  if(!(Number.isInteger(n) && n >= 1 && n <= RECIPE_MAX)) return;
  S.mixLimit = n; save(); plLoad('random'); renderList();
}
function randomListen(){
  if(S.view !== 'feed'){ S.view = 'feed'; save(); renderAll(); }  // random always picks from the feed
  const rows = feedView();
  if(!rows.length) return;
  const i = Math.floor(Math.random() * rows.length);
  const pick = rows[i];
  EXPANDED = pick.id;  // open it here first; LISTEN is one tap away
  PAGE_N = Math.max(PAGE_N, Math.ceil((i + 1) / PAGE));  // the pick may sit past the rendered pages
  loadTracks([pick.id]);
  renderList();
  const el = [...document.querySelectorAll('.row')].find(x => x.dataset.id === pick.id);
  if(el && el.scrollIntoView) el.scrollIntoView({ block: 'center' });
}
function toggleExpand(id){
  EXPANDED = EXPANDED === id ? null : id;
  if(EXPANDED) loadTracks([id]);
  renderList();
}
function openAlbum(id){ ALBUM = id; loadTracks([id]); renderAlbum(); }
function closeAlbum(){ ALBUM = null; renderAlbum(); }
function toggleLibLiked(){ S.libLiked = !S.libLiked; save(); renderAll(); }
function toggleQueued(id){ editEntry(id, e => {
  const on = e.status === 'queued';
  e.status = on ? 'unsorted' : 'queued';
  e.queuedOn = on ? null : todayLocal();
}); }
function hideTrack(id){ editEntry(id, e => { e.status = 'hidden'; e.queuedOn = null; }); }
function unhideTrack(id){ editEntry(id, e => { e.status = 'unsorted'; }); }
function toggleLiked(id){ editEntry(id, e => { e.liked = !e.liked; }); }
function isTrackLiked(id, title){
  const f = fold(title);
  return (E(id).likedTracks || []).some(t => fold(t) === f);
}
function toggleTrackLike(id, title){ editEntry(id, e => {
  const f = fold(title);
  e.likedTracks = e.likedTracks.some(t => fold(t) === f)
    ? e.likedTracks.filter(t => fold(t) !== f)
    : e.likedTracks.concat([title]);  // store the display title; compare folded
}); }
function setLibView(v){ if(LIB_VIEWS.includes(v)){ S.libView = v; CSHEET = null; save(); ensureViewTracks(); renderAll(); } }
function setPlYear(y){ S.plYear = /^\d{4}$/.test(y) ? y : 'all'; save(); renderAll(); }
function setPlGenre(bucket, g){
  if(bucket !== 'game' && bucket !== 'screen') return;
  S.plGenre[bucket] = g || 'all';
  save(); renderAll();
}
function toggleShowHidden(){ S.showHidden = !S.showHidden; save(); renderAll(); }
function markVisit(){ S.lastSeen = Date.now(); save(); }
function setQuery(q){ Q = q; renderAll(); }

function openLog(id){
  const e = E(id);
  SHEET = { id, draft: { listenedOn: e.listenedOn || todayLocal(),
                         rating: e.rating, liked: e.liked, note: e.note } };
  renderSheet();
}
function closeLog(){ SHEET = null; renderSheet(); }
function saveLog(){
  const { id, draft } = SHEET;
  SHEET = null;
  editEntry(id, e => {
    e.status = 'listened';
    e.listenedOn = isDateStr(draft.listenedOn) ? draft.listenedOn : todayLocal();
    e.rating = validRating(draft.rating) ? draft.rating : null;
    e.liked = draft.liked === true;
    e.note = String(draft.note || '').trim().slice(0, 200);
    e.queuedOn = null;
  });
}
function clearListen(){
  const id = SHEET.id;
  SHEET = null;
  editEntry(id, e => { e.status = 'unsorted'; e.listenedOn = null; });
}

/* ========================== derived ============================ */
function byId(id){ return BYID[id] || null; }
function firstSeen(r){
  let t = Infinity;
  for(const s of r.sources || []){ const p = Date.parse(s.seenAt); if(p && p < t) t = p; }
  return t === Infinity ? 0 : t;
}
function isNew(r){ return PREV_SEEN > 0 && firstSeen(r) > PREV_SEEN; }
function ytmUrl(r){ return r.ytmAlbumUrl || r.ytmSearchUrl; }
const SRC_RANK = { editorial: 0, catalog: 1, community: 2 };
function srcRank(r){
  const ranks = (r.sources || []).map(s => SRC_RANK[s.type] ?? 1);
  return ranks.length ? Math.min(...ranks) : 1;
}
function dcmp(b, a){ return String(b || '').localeCompare(String(a || '')); }  // desc, nulls sink
function buildIndexes(){
  // R never changes after boot, so the id index and the shared newest-first
  // order are computed exactly once; every view filters a copy of BASE
  BYID = {};
  R.releases.forEach((r, i) => { BYID[r.id] = r; TRACKNO[r.id] = i + 1; });  // append-only: numbers never reshuffle
  BASE = R.releases.slice().sort((a, b) =>
    dcmp(b.date, a.date) ||
    srcRank(a) - srcRank(b) ||   // same day: an editor's pick outranks the firehose outranks the crowd
    firstSeen(b) - firstSeen(a) ||
    TRACKNO[b.id] - TRACKNO[a.id]);
}
function sorted(){ return BASE; }

/* tracklists live in data/tracks/<id>.json since the Phase A split; they are
   fetched when a view first needs them and cached for the session. A missing
   file is not an error: the row simply degrades to its search link. */
function tracksOf(r){
  if(r.tracks && r.tracks.length) return r.tracks;  // pre-split rows, until the collector migrates
  return TRACKS[r.id] || null;
}
function needsTrackLoad(r){
  return (r.tracksN || 0) > 0 && !(r.tracks || []).length && !TRACKS[r.id];
}
/* scores only, one track at a time: the collector marks every film or TV
   track credited to someone other than the score composer as a song
   (song: true) and counts the rest on the row (scoresN). The album always
   stays; only its songs leave. Games are scores by definition. */
function scoreTracks(r, tt){ return mediumOf(r) === 'game' ? tt : tt.filter(t => !t.song); }
function viewScores(){ return S.view === 'feed' ? S.feedScores : S.view === 'library' ? S.libScores : false; }
function shownTracks(r){ const tt = tracksOf(r) || []; return viewScores() ? scoreTracks(r, tt) : tt; }
function albumMoods(r){ return Array.isArray(r.moods) ? r.moods.filter(m => MOODS.includes(m)) : []; }  // the album's top three, commonest first
function moodTracks(tt, moods){ return tt.filter(t => (t.moods || []).some(m => moods.includes(m))); }
function anyMoods(){ return R.releases.some(r => albumMoods(r).length > 0); }
function moodList(ms){ return ms.length < 2 ? ms.join('') : ms.slice(0, -1).join(', ') + ' or ' + ms[ms.length - 1]; }
function loadTracks(ids){
  const ps = [];
  for(const id of [...new Set(ids)]){
    const r = byId(id);
    if(!r || !needsTrackLoad(r)) continue;
    if(!TPEND[id]){
      TLOAD[id] = 'loading';
      TPEND[id] = fetch('data/tracks/' + encodeURIComponent(id) + '.json', { cache: 'no-store' })
        .then(resp => { if(!resp.ok) throw new Error('HTTP ' + resp.status); return resp.json(); })
        .then(list => { TRACKS[id] = Array.isArray(list) ? list : []; delete TLOAD[id]; })
        .catch(() => { TLOAD[id] = 'error'; })  // rendered as absent; the next tap retries
        .finally(() => { delete TPEND[id]; });
    }
    ps.push(TPEND[id]);  // a second caller waits for the same fetch, never skips it
  }
  if(!ps.length) return Promise.resolve();
  return Promise.all(ps).then(() => {
    clearTimeout(TRK_TIMER);
    TRK_TIMER = setTimeout(() => { renderList(); renderAlbum(); }, 30);
  });
}
function likedIds(){

/* ------------------------- playlist recipes -------------------------- */
/* composed from personal state; exported as JSON for the local companion */
function plFacetRows(rows){

function plTrack(r, t){

function plLiked(){

function plQueue(){

const RECIPE_PLAYS_ALBUMS = 150;   // most played over a huge pool reads this many albums, by playsTotal

function reseed(key){ RSEED[key] = Math.floor(Math.random() * 0x7fffffff); }
function seededRng(seed){
  // mulberry32: tiny, deterministic, plenty to deal a playlist
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

function recipeById(id){ return S.recipes.find(p => p.id === id) || null; }
function recipeMedium(rec){ return multiMedium() ? rec.medium : 'game'; }  // a games-only catalog behaves as games
function recipeGenre(rec){

function recipeSourceRows(rec){

    const e = S.entries[r.id];

  return sorted().filter(r => !r.retired && E(r.id).status !== 'hidden');

function recipeAlbums(rec){

  const g = recipeGenre(rec);
  if(g) rows = rows.filter(r => (r.genres || []).includes(g));
  if(m === 'game'){  // scope and console live and die with the games medium, as in the feed
    if(rec.co !== 'all') rows = rows.filter(r => coTier(r) === rec.co);
    if(rec.console) rows = rows.filter(r => r.console === true);
  }
  if(rec.yearFrom || rec.yearTo) rows = rows.filter(r => {
    const y = (r.date || '').slice(0, 4);
    return /^\d{4}$/.test(y) && (!rec.yearFrom || y >= rec.yearFrom) && (!rec.yearTo || y <= rec.yearTo);
  });
  const comp = fold(rec.composer.trim());
  if(comp) rows = rows.filter(r => fold((r.composers || []).join(' ')).includes(comp));
  if(rec.rating !== 'any'){
    const min = +rec.rating;
    rows = rows.filter(r => { const e = S.entries[r.id]; return !!e && e.rating != null && e.rating >= min; });
  }
  if(rec.hearted) rows = rows.filter(r => (E(r.id).likedTracks || []).length > 0);
  if(rec.moods.length) rows = rows.filter(r => albumMoods(r).some(m => rec.moods.includes(m)));  // an album joins on its top three

function availTracks(r, scores){
  // how many tracks an album can offer: what is loaded, else what the row promises

  if((r.tracksN || 0) > 0) return scores && mediumOf(r) !== 'game' && r.scoresN != null ? r.scoresN : r.tracksN;
  return (r.topTracks || []).length;
}
function moodAvail(r, rec){
  // tracks carrying a chosen mood: counted once the tracklist is loaded, else
  // the row's count for the chosen mood it has most of, a floor when several
  // are chosen because a track can carry more than one
  const tt = tracksOf(r);
  if(tt && tt.length){ const m = moodTracks(tt, rec.moods); return (rec.scores ? scoreTracks(r, m) : m).length; }
  const ns = r.moodsN || [];
  const n = Math.max(0, ...albumMoods(r).map((m, i) => rec.moods.includes(m) ? ns[i] || 1 : 0));

function recipeAlbumCount(rec, r){
  if(rec.pick === 'hearted'){

    const songsOut = rec.scores && mediumOf(r) !== 'game';
    if(!tt || !(songsOut || rec.moods.length)) return hearts.length;  // unloaded: a heart cannot be told from a song, or read for mood, yet

      const t = tt.find(x => fold(x.title) === fold(title));
      if(songsOut && t && t.song) return false;
      return !rec.moods.length || (!!t && moodTracks([t], rec.moods).length > 0);
    }).length;

function recipeAlbumTracks(rec, r){
  if(rec.pick === 'hearted'){

    let hearts = (E(r.id).likedTracks || []).map(title => tt.find(x => fold(x.title) === fold(title)) || { title });
    if(rec.moods.length) hearts = moodTracks(hearts, rec.moods);

  }
  let tt = tracksOf(r) || r.topTracks || [];   // a missing tracklist falls back to the row's top tracks
  if(rec.moods.length) tt = moodTracks(tt, rec.moods);  // any chosen mood, AND with every other rule

  else if(rec.order === 'album') out.sort((a, b) => label(a).toLowerCase().localeCompare(label(b).toLowerCase()) || TRACKNO[a.id] - TRACKNO[b.id]);

      if(recipeAlbumCount(rec, r) > 0) ids.push(r.id);

  let n = 0, extra = 0;
  for(const r of rows){

  } else {
    for(const r of rows){

  if(g) bits.push(g.toLowerCase());

/* ======================= custom playlists ====================== */
/* YT Music's grammar: first save opens the picker, then the chosen
   playlist stays the target — "Saved to X · change" — for a while.
   YTM scopes that to the app session; a phone PWA session is fuzzier,
   so ten minutes from the last add stands in for it. */
const CPL_STICKY_MS = 10 * 60000;
function cplById(id){ return S.cpls.find(p => p.id === id) || null; }
function cplNew(name){
  const nm = String(name || '').trim().slice(0, 80);
  if(!nm) return null;
  const p = { id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: nm, at: Date.now(), tracks: [] };
  S.cpls.push(p); save();
  return p;
}
function stickyCpl(){
  const l = S.cplLast;
  if(!l || Date.now() - l.at > CPL_STICKY_MS) return null;
  return cplById(l.id);
}
function cplAdd(plId, rid, title){
  const p = cplById(plId); if(!p) return;
  const f = fold(title);
  const dupe = p.tracks.some(x => x.id === rid && fold(x.t) === f);
  if(!dupe) p.tracks.push({ id: rid, t: title });
  p.at = Date.now();
  S.cplLast = { id: plId, at: Date.now() };
  save();
  CPICK = null;
  toast((dupe ? 'already in ' : 'saved to ') + p.name, { rid, t: title, from: plId });
  renderAll();
}
function cplPull(plId, rid, title){
  const p = cplById(plId); if(!p) return;
  const f = fold(title);
  p.tracks = p.tracks.filter(x => !(x.id === rid && fold(x.t) === f));
}
function addFlow(rid, title){
  const tgt = stickyCpl();
  if(tgt){ cplAdd(tgt.id, rid, title); return; }
  CPICK = { rid, t: title };
  renderSheet();
}

/* ==================== one-tap phone publish ==================== */
const PUB_REPO = 'cjmerc39/vgm-publisher';
const PUB_KEY = 'vgm-pub-token';   // own storage key: state backups must never carry the token
let PUBSTATE = {};                 // playlist key -> 'sending' | 'watching' | 'sent' | 'ok' | error text
let PUB_POLL_MS = 8000;
function pubToken(){ try{ return localStorage.getItem(PUB_KEY) || ''; }catch(e){ return ''; } }
function setPubToken(t){ try{ t ? localStorage.setItem(PUB_KEY, t) : localStorage.removeItem(PUB_KEY); }catch(e){} PUBSTATE = {}; }
async function publishPlaylist(key){
  const busy = PUBSTATE[key] === 'sending' || PUBSTATE[key] === 'watching';
  if(busy) return;
  await plLoad(key);  // videoIds live in the track files now
  const tok = pubToken(), data = plExportObj(key);
  if(!tok || !data || !data.tracks.length) return;
  const body = JSON.stringify({ event_type: 'publish', client_payload: { playlist: data } });
  if(body.length > 60000){ PUBSTATE[key] = 'too big — export instead'; renderList(); return; }  // dispatch caps payloads at 64KB
  PUBSTATE[key] = 'sending'; renderList();
  let sent = false;
  try{
    const res = await fetch('https://api.github.com/repos/' + PUB_REPO + '/dispatches', {
      method: 'POST', body,
      headers: { 'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
    });
    sent = res.status === 204;
    if(!sent) PUBSTATE[key] = res.status === 401 ? 'token rejected' : 'send failed (' + res.status + ')';
  }catch(e){ PUBSTATE[key] = 'offline?'; }
  if(sent){
    PUBSTATE[key] = 'watching'; renderList();
    PUBSTATE[key] = await watchPublish(tok, Date.now());
  }
  renderList();
}
async function watchPublish(tok, t0){
  // the run takes about a minute; report its verdict when the token may read Actions, else settle for "sent"
  for(let i = 0; i < 24; i++){
    await new Promise(r => setTimeout(r, PUB_POLL_MS));
    let run = null;
    try{
      const res = await fetch('https://api.github.com/repos/' + PUB_REPO + '/actions/runs?event=repository_dispatch&per_page=1', {
        headers: { 'Authorization': 'Bearer ' + tok, 'Accept': 'application/vnd.github+json' } });
      if(!res.ok) return 'sent';
      run = ((await res.json()).workflow_runs || [])[0];
    }catch(e){ return 'sent'; }
    if(!run || Date.parse(run.created_at) < t0 - 90000) continue;  // our run hasn't surfaced yet
    if(run.status === 'completed') return run.conclusion === 'success' ? 'ok' : 'run failed — see Actions';
  }
  return 'sent';
}

const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function fmtDate(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
  if(!m) return '';
  const label = MONTHS[+m[2] - 1] + ' ' + (+m[3]);
  return +m[1] === new Date().getFullYear() ? label : label + ' ' + m[1];
}
function todayLocal(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function motionOk(){ return !!(window.matchMedia && matchMedia('(prefers-reduced-motion: no-preference)').matches); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pad3(n){ return String(n).padStart(3, '0'); }
function minis(rating){
  if(rating == null) return '';
  return '★'.repeat(Math.floor(rating)) + (rating % 1 ? '½' : '');
}
function playsNum(s){
  const m = /^([\d.,]+)\s*([KMB])?/i.exec(String(s || '').trim());
  if(!m) return null;
  const n = parseFloat(m[1].replace(/,/g, ''));
  return isNaN(n) ? null : n * ({ K:1e3, M:1e6, B:1e9 }[(m[2] || '').toUpperCase()] || 1);
}
function playsRank(tt){
  // track indexes by plays, most first; null when no play count is known
  const scored = tt.map((t, i) => ({ i, n: playsNum(t.plays) }));
  if(!scored.some(x => x.n != null)) return null;
  scored.sort((a, b) => (b.n ?? -1) - (a.n ?? -1));
  return scored.map(x => x.i);
}
function top3Of(r, list){
  const tt = list || tracksOf(r) || [];
  const rank = playsRank(tt);
  if(!rank) return { idx: new Set(), ranked: tt.slice(0, 3), byPlays: false };
  const top = rank.slice(0, 3);
  return { idx: new Set(top), ranked: top.map(i => tt[i]), byPlays: true };
}
function topNOf(tt, n){
  // the same ranking for any N: by plays when known, else running order
  const rank = playsRank(tt);
  return rank ? rank.slice(0, n).map(i => tt[i]) : tt.slice(0, n);
}
function trackUrl(r, t){
  if(t.videoId) return 'https://music.youtube.com/watch?v=' + t.videoId +
    (r.ytmPlaylistId ? '&list=' + r.ytmPlaylistId : '');  // album context: the song plays, not the video
  return 'https://music.youtube.com/search?q=' + encodeURIComponent((r.game || label(r)) + ' ' + t.title);
}

function genreCounts(medium, sel){
  // counts come from the selected medium's rows only, so IGDB and TMDb
  // genre vocabularies never mix in one list; screen unions film and tv
  const counts = {};
  for(const r of R.releases){
    if(r.retired || !mediumMatches(medium, r)) continue;
    for(const g of r.genres || []) counts[g] = (counts[g] || 0) + 1;
  }
  const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 24);
  if(sel && sel !== 'all' && !names.includes(sel)) names.push(sel);
  return names.map(n => [n, counts[n] || 0]);
}

function plYearList(){
  const years = new Set();
  for(const r of R.releases){
    if(r.retired) continue;
    const y = (r.date || '').slice(0, 4); if(/^\d{4}$/.test(y)) years.add(y);
  }
  const list = [...years].sort().reverse();
  if(S.plYear !== 'all' && !list.includes(S.plYear)) list.push(S.plYear);
  return list;
}

function yearCounts(){
  // years present in the current filtered feed, newest first, undated last
  const counts = {};
  for(const r of feedView()){
    const y = (r.date || '').slice(0, 4) || '····';
    counts[y] = (counts[y] || 0) + 1;
  }
  const ys = Object.keys(counts).filter(y => y !== '····').sort().reverse();
  if(counts['····']) ys.push('····');
  return ys.map(y => [y, counts[y]]);
}

  }

    ? `<div class="rart"><img src="${esc(r.art)}" alt="" loading="lazy" decoding="async" onerror="this.parentNode.classList.add('noart');this.remove()"></div>`
    : `<div class="rart noart"></div>`;
  const expanded = !ghost && EXPANDED === r.id;
  return `<div class="row${heard && view === 'feed' ? ' heard' : ''}${ghost ? ' ghost' : ''}" data-id="${esc(r.id)}" tabindex="0" role="button" aria-expanded="${expanded}" aria-label="${esc(label(r))}">

      <div class="rbar">${meta}<div class="racts">${acts}</div></div>

}

      ${tlikeHtml(r, t)}
    </div>`).join('')

       : (tracksOf(r) || []).length ? `<div class="atrack"><span class="ttl">songs only, hidden by scores only</span></div>` : '');
  wrap.innerHTML = `<div id="album">
    <div class="ahead"><button class="aclose" aria-label="Back">✕</button><span class="tno">TRACK ${pad3(TRACKNO[r.id] || 0)}</span></div>
    <div class="abody">
      <div class="aart${r.art ? '' : ' noart'}">${r.art ? `<img src="${esc(r.art)}" alt="" onerror="this.parentNode.classList.add('noart');this.remove()">` : ''}</div>
      <div class="atitle">${esc(label(r))}</div>
      ${[r.game, (r.composers || []).join(', ')].filter(Boolean).length ? `<div class="asub">${esc([r.game, (r.composers || []).join(', ')].filter(Boolean).join(' · '))}</div>` : ''}
      ${meta ? `<div class="ameta">${esc(meta)}</div>` : ''}
      ${e.rating != null ? `<div class="ameta"><span class="minis">${minis(e.rating)}</span></div>` : ''}

      <div class="alist">${rows}</div>

  const now = wrap.querySelector('#album');

function stateHtml(big, body){ return `<div class="state"><div class="big">${big}</div><p>${body}</p></div>`; }

function emptyHtml(){
  const q = Q.trim();
  if(q) return stateHtml('NO MATCHES', `Nothing matches “${esc(q)}” here.`);
  if(S.view === 'feed' && FMOOD) return stateHtml('NO MATCHES', `No album in this feed has ${esc(FMOOD)} among its top moods.`);
  if(S.view === 'queue') return stateHtml('QUEUE EMPTY', 'Tap + on anything in the feed worth hearing and it lands here.');
  if(S.view === 'library'){
    if(S.libView === 'songs')
      return stateHtml('NO LIKED SONGS', 'Tap the ♡ next to any track — in a row’s track list or on its album page — and it lands here.');
    return S.libLiked
      ? stateHtml('NO LIKED TRACKS', 'The ♥ lives in the logging sheet and on library rows.')
      : stateHtml('NOTHING LOGGED YET', 'The ▷ on any row opens the logging sheet and starts your diary.');
  }
  return stateHtml('ALL TRACKS HIDDEN', 'Everything is hidden. Use “show” below to bring tracks back.');
}

function pageKey(){
  // showHidden stays out on purpose: revealing the hidden shelf must not
  // reset paging or throw the scroll position back to the top
  return [S.view, S.libView, S.feedSort, S.feedCo, S.feedConsole,
          S.feedGenre.game, S.feedGenre.screen, S.feedMedium,
          S.libSort, S.libLiked, S.libMedium, Q.trim(), FMOOD].join('\n');
}
function pageSlice(list){
  // a new list identity starts back at page one; actions on rows (expand,
  // heart, log) keep the identity and therefore the paging and scroll spot
  const key = pageKey();
  if(key !== PAGE_KEY){ PAGE_KEY = key; PAGE_N = 1; }
  return { shown: list.slice(0, PAGE_N * PAGE), left: Math.max(0, list.length - PAGE_N * PAGE) };
}
function moreHtml(left){
  return left > 0 ? `<button id="more" class="xall">MORE · ${left} TO GO</button>` : '';
}
function rowsHtml(rows, from, to, view){
  const rails = view === 'feed' && (S.feedSort === 'date' || S.feedSort === 'oldest');
  let year = rails && from > 0 ? ((rows[from - 1].date || '').slice(0, 4) || '····') : null;
  let html = '';
  for(let i = from; i < Math.min(to, rows.length); i++){
    const r = rows[i];
    if(rails){
      const y = (r.date || '').slice(0, 4) || '····';
      if(y !== year) html += `<div class="yhead">${y}</div>`;
      year = y;
    }
    html += rowHtml(r, view, false);
  }
  return html;
}
function pagedRows(){
  if(S.view === 'library' && S.libView === 'songs')
    return likedSongRows(S.libScores).filter(s => songMatches(s, Q.trim()));
  if(S.view === 'feed') return feedView();
  return searched(S.view === 'queue' ? queueRows() : libraryRows());
}
function morePage(){
  const btn = document.getElementById('more');
  if(!btn || pageKey() !== PAGE_KEY){ PAGE_N += 1; renderList(); return; }
  // append the next page in place: a full re-render would rebuild every
  // shown row and re-create its cover image, which crawls deep in the catalog
  const rows = pagedRows();
  const from = PAGE_N * PAGE;
  PAGE_N += 1;
  const songs = S.view === 'library' && S.libView === 'songs';
  const html = songs ? rows.slice(from, PAGE_N * PAGE).map(songRowHtml).join('')
                     : rowsHtml(rows, from, PAGE_N * PAGE, S.view);
  btn.insertAdjacentHTML('beforebegin', html);
  const left = Math.max(0, rows.length - PAGE_N * PAGE);
  if(left === 0) btn.remove();
  else btn.textContent = `MORE · ${left} TO GO`;
  observeMore();
}
function observeMore(){
  if(MORE_IO){ MORE_IO.disconnect(); MORE_IO = null; }
  const btn = document.getElementById('more');
  if(!btn || typeof IntersectionObserver === 'undefined') return;  // without IO the button still pages
  MORE_IO = new IntersectionObserver(es => { if(es.some(x => x.isIntersecting)) morePage(); },
                                     { root: document.querySelector('main') });
  MORE_IO.observe(btn);
}
function jumpToYear(y){
  const rows = feedView();
  const idx = rows.findIndex(r => ((r.date || '').slice(0, 4) || '····') === y);
  if(idx < 0) return;
  pageSlice(rows);  // sync PAGE_KEY first so the bump below survives the render
  PAGE_N = Math.max(PAGE_N, Math.ceil((idx + 1) / PAGE));
  renderList();
  const head = [...document.querySelectorAll('#list .yhead')].find(h => h.textContent === y)
    || document.querySelector(`#list .row[data-id="${rows[idx].id}"]`);  // no rails outside date sorts: land on the year's first row
  if(head && head.scrollIntoView) head.scrollIntoView({ block: 'start', behavior: motionOk() ? 'smooth' : 'auto' });
}
function renderList(){
  const el = document.getElementById('list');
  if(LOADSTATE === 'loading'){ el.innerHTML = stateHtml('LOADING…', 'Reading the release log.'); return; }
  if(LOADSTATE === 'error'){
    el.innerHTML = stateHtml('READ ERROR', `Couldn't load <code>data/releases.json</code> (${esc(LOADERR)}). ` +
      'If this deploy is brand new, GitHub Pages is probably still building — reload in a minute.');
    return;
  }
  if(LOADSTATE === 'empty'){
    el.innerHTML = stateHtml('NO TRACKS YET', 'The collector runs every morning at 6 ET. The first batch lands after its next run.');
    return;
  }
  if(S.view === 'library' && S.libView === 'songs'){
    const songs = pagedRows();
    const { shown, left } = pageSlice(songs);
    el.innerHTML = songs.length ? shown.map(songRowHtml).join('') + moreHtml(left) : emptyHtml();
    observeMore();
    return;
  }
  if(S.view === 'library' && S.libView === 'playlists'){ el.innerHTML = playlistsHtml(); return; }
  const rows = pagedRows();
  const { left } = pageSlice(rows);
  let html = S.view === 'feed' && FMOOD
    ? `<div id="moodbar"><span class="mlabel">MOOD · ${esc(FMOOD.toUpperCase())}</span>` +
      `<span class="mn">${rows.length} album${rows.length === 1 ? '' : 's'}</span>` +
      `<button id="moodclear">✕ clear</button></div>`
    : '';
  html += rows.length ? rowsHtml(rows, 0, PAGE_N * PAGE, S.view) : emptyHtml();
  html += moreHtml(left);
  if(S.showHidden && hiddenRows().length){
    html += `<div id="hidhead">HIDDEN (${hiddenRows().length})</div>` +
            hiddenRows().map(r => rowHtml(r, S.view, true)).join('');
  }
  el.innerHTML = html;
  observeMore();
}

}

        `<input id="rc-composer" placeholder="any composer" maxlength="80" autocomplete="off" value="${esc(rc.composer)}" aria-label="Composer">` +
      `<div class="slab">Rating</div>` + segs('rating', [['any', 'any'], ['3', '3★+'], ['4', '4★+'], ['5', '5★']], rc.rating) +
      toggle('hearted', '♥ albums only', rc.hearted) +
      `<div class="slab">Tracks per album</div>` + segs('pick', [['all', 'all'], ['top', 'top n'], ['hearted', '♥ only']], rc.pick) +
      (rc.pick === 'top' ? segs('topN', [1, 2, 3, 4, 5].map(n => [n, String(n)]), rc.topN) : '') +
      `<div class="slab">Limit</div>` + segs('limit', RECIPE_LIMITS.map(n => [n, String(n)]), rc.limit) +
      `<div class="shyears"><input id="rc-limit" inputmode="numeric" maxlength="3" value="${rc.limit}" autocomplete="off" aria-label="Track limit">` +
        `<span>tracks, up to ${RECIPE_MAX}</span></div>` +
      `<div class="slab">Order</div>` +
        segs('order', [['plays', 'most played'], ['album', 'album'], ['newest', 'newest'], ['shuffle', 'shuffle']], rc.order);
    footer = `<div class="shfoot"><button id="rc-cancel">cancel</button><button id="rc-save">save</button></div>`;
  } else if(CSHEET === 'rgenre'){
    label = 'Genre';
    const rc = RDRAFT.rec, m = recipeMedium(rc);
    const sel = rc.genre[m === 'game' ? 'game' : 'screen'];
    body = `<button class="shrow" id="shback"><span class="shl">‹ back to the recipe</span></button>` +
      shPickRow('shrg', 'all', 'all', sel === 'all' ? '✓' : '') +
      genreCounts(m, sel).map(([g, n]) => shPickRow('shrg', g, g.toLowerCase(), `${n}${sel === g ? ' ✓' : ''}`)).join('');
  } else if(CSHEET === 'rmood'){
    // several at once: an album joins when one of them is in its top three,
    // and brings the tracks tagged with any of them; the counts are albums
    label = 'Mood';
    const rc = RDRAFT.rec, base = recipeAlbums(Object.assign({}, rc, { moods: [] }));
    const albumsWith = m => base.filter(r => albumMoods(r).includes(m)).length;
    body = `<button class="shrow" id="shback"><span class="shl">‹ back to the recipe</span></button>` +
      `<div class="rcount" id="rcount">${esc(recipeCountLine(recipeStats(rc), rc))}</div>` +
      shPickRow('shrm', 'any', 'any', rc.moods.length ? '' : '✓') +
      MOODS.map(m => shPickRow('shrm', m, m, `${albumsWith(m)}${rc.moods.includes(m) ? ' ✓' : ''}`)).join('');
  } else if(CSHEET === 'libfilters'){
    label = 'Filters';
    const seg = (attr, val, name, on) =>
      `<button data-${attr}="${val}" class="${on ? 'on' : ''}">${name}</button>`;
    const lm = libMediumEff();
    body = (multiMedium()
        ? `<div class="slab">Medium</div><div class="shseg">` +
          seg('shlmed', 'all', 'all', lm === 'all') +
          seg('shlmed', 'game', 'games', lm === 'game') +
          seg('shlmed', 'screen', 'film + tv', screenish(lm)) + `</div>` +
          (screenish(lm)
            ? `<div class="shseg">` +
              seg('shlsub', 'screen', 'both', lm === 'screen') +
              seg('shlsub', 'film', 'film', lm === 'film') +
              seg('shlsub', 'tv', 'tv', lm === 'tv') + `</div>`
            : '') +
          (lm !== 'game'  // games are scores by definition: the row would do nothing
            ? `<button class="shrow" id="shlscores" aria-pressed="${S.libScores}">` +
              `<span class="shl">scores only</span><span class="shr">${S.libScores ? '✓' : ''}</span></button>`
            : '')
        : '') +
      (S.libView === 'songs' ? ''  // every row here is already a liked track
        : `<div class="slab">Show</div>` +
          `<button class="shrow" id="shliked" aria-pressed="${S.libLiked}">` +
          `<span class="shl">♥ only</span><span class="shr">${S.libLiked ? '✓' : ''}</span></button>`);
    footer = `<div class="shfoot"><button id="shclear">clear</button><button id="shdone">done</button></div>`;
  } else {  // feed filters: medium first, the rest follows the selection
    label = 'Filters';
    const seg = (attr, val, name, on) =>
      `<button data-${attr}="${val}" class="${on ? 'on' : ''}">${name}</button>`;
    const mode = feedMediumEff();
    // the genre is one row naming the pick; the list lives in its own sheet
    const genreRow = sel => `<button class="shrow" id="shgenrerow"><span class="shl">genre · ${esc(sel === 'all' ? 'all' : sel.toLowerCase())}</span>` +
      `<span class="shr">▸</span></button>`;
    const scoresRow = `<button class="shrow" id="shscores" aria-pressed="${S.feedScores}">` +
      `<span class="shl">scores only</span><span class="shr">${S.feedScores ? '✓' : ''}</span></button>`;
    body = multiMedium()
      ? `<div class="slab">Medium</div><div class="shseg">` +
        seg('shmed', 'all', 'all', mode === 'all') +
        seg('shmed', 'game', 'games', mode === 'game') +
        seg('shmed', 'screen', 'film + tv', screenish(mode)) + `</div>`
      : '';
    if(mode === 'game'){
      body +=
        `<div class="slab">Scope</div>` +
        `<div class="shseg">` +
          seg('shco', 'all', 'all', S.feedCo === 'all') +
          seg('shco', 'big', 'big studios', S.feedCo === 'big') +
          seg('shco', 'indie', 'indie', S.feedCo === 'indie') + `</div>` +
        `<button class="shrow" id="shconsole" aria-pressed="${S.feedConsole}">` +
          `<span class="shl">console</span><span class="shr">${S.feedConsole ? '✓' : ''}</span></button>` +
        genreRow(S.feedGenre.game);
    } else if(screenish(mode)){
      body +=
        `<div class="shseg">` +
          seg('shsub', 'screen', 'both', mode === 'screen') +
          seg('shsub', 'film', 'film', mode === 'film') +
          seg('shsub', 'tv', 'tv', mode === 'tv') + `</div>` +
        scoresRow + genreRow(S.feedGenre.screen);
    } else {
      body += scoresRow;  // mode all: songs still leave film and tv tracklists; games are untouched
    }
    footer = `<div class="shfoot"><button id="shclear">clear</button><button id="shdone">done</button></div>`;
  }
  const tall = CSHEET === 'recipe' || CSHEET === 'rgenre' || CSHEET === 'rmood' ? ' tall' : '';  // the recipe sheet runs full height
  return `<div id="scrim"></div>` +
    `<div id="sheet" class="ctrl${tall}" role="dialog" aria-modal="true" aria-label="${esc(label)}">` +
    `<div class="shbody">${body}</div>${footer}</div>`;
}
let SHEET_SCROLL = {};   // control sheet -> where its list was scrolled, so a picker reopens where it was left
let SHEET_LAST = null;   // the control sheet on screen after the last render
function renderSheet(){
  const wrap = document.getElementById('sheetwrap');
  if(CPICK && CSHEET) CSHEET = null;  // the save picker takes the sheet over cleanly
  const prev = wrap.querySelector('#sheet.ctrl .shbody');
  if(prev && SHEET_LAST) SHEET_SCROLL[SHEET_LAST] = prev.scrollTop;
  if(CPICK){ wrap.innerHTML = pickerHtml(); SHEET_LAST = null; return; }
  if(CSHEET){
    const same = !!prev && SHEET_LAST === CSHEET;
    wrap.innerHTML = csheetHtml();
    const sh = wrap.querySelector('#sheet');
    if(same) sh.style.animation = 'none';  // live-apply re-render: no slide-up replay
    const body = sh.querySelector('.shbody');
    if(body && SHEET_SCROLL[CSHEET]) body.scrollTop = SHEET_SCROLL[CSHEET];
    SHEET_LAST = CSHEET;
    return;
  }
  SHEET_LAST = null;
  if(!SHEET){ wrap.innerHTML = ''; return; }
  const r = byId(SHEET.id) || { title: SHEET.id };
  const d = SHEET.draft;
  const stars = [1, 2, 3, 4, 5].map(i => {
    const fill = d.rating == null ? 0 : Math.max(0, Math.min(1, d.rating - (i - 1)));
    return `<div class="star"><span class="sbase">★</span><span class="sfill" style="width:${fill * 100}%">★</span>` +
      `<button class="hl" data-r="${i - 0.5}" aria-label="${i - 0.5} stars"></button>` +
      `<button class="hr" data-r="${i}" aria-label="${i} stars"></button></div>`;
  }).join('');
  const wasListened = E(SHEET.id).status === 'listened';
  wrap.innerHTML = `<div id="scrim"></div>
  <div id="sheet" role="dialog" aria-modal="true" aria-label="Log listen">
    <div class="shead"><span class="tno">TRACK ${pad3(TRACKNO[SHEET.id] || 0)}</span><div class="stitle">${esc(label(r))}</div></div>
    <div class="slab">Listened on</div>
    <input type="date" id="sh-date" value="${esc(d.listenedOn)}">
    <div class="slab">Rating${d.rating != null ? ` <button id="sh-clear">clear</button>` : ''}</div>
    <div id="sh-stars">${stars}</div>
    <div class="srow">
      <button id="sh-heart" class="${d.liked ? 'on' : ''}" aria-pressed="${d.liked}" aria-label="Liked">${d.liked ? '♥' : '♡'}</button>
      <input id="sh-note" placeholder="One line worth remembering" maxlength="200" value="${esc(d.note)}">
    </div>
    <div class="sactions">
      <button id="sh-save">SAVE</button>
      ${wasListened ? '<button id="sh-unlog">clear this listen</button>' : ''}
    </div>
  </div>`;
}

let PENDING_OPEN = null;
function navTo(url){ location.href = url; }
function openUrl(url){
  if(STANDALONE){ navTo(url); return; }  // universal link hands straight to the app: no leftover sheet
  const w2 = window.open(url, '_blank');
  if(w2){ try{ w2.opener = null; }catch(e){} PENDING_OPEN = w2; }
}
function openTrack(r){ if(r) openUrl(ytmUrl(r)); }
document.addEventListener('visibilitychange', () => {
  // iOS standalone: the _blank sheet is left blank once the YT Music app takes
  // over; closing it when we regain focus lands the return trip on the app
  if(document.visibilityState !== 'hidden' && PENDING_OPEN){
    try{ PENDING_OPEN.close(); }catch(e){}
    PENDING_OPEN = null;
  }
});

document.getElementById('list').addEventListener('click', e => {
  if(e.target.closest('a')) return;  // article links navigate normally
  if(e.target.closest('#more')){ morePage(); return; }
  if(e.target.closest('#moodclear')){ clearFeedMood(); return; }
  const pp = e.target.closest('[data-plp]');
  if(pp){ publishPlaylist(pp.dataset.plp); return; }
  const px = e.target.closest('[data-plx]');
  if(px){ exportPlaylist(px.dataset.plx); return; }
  if(e.target.closest('#pubsave')){
    const inp = document.getElementById('pubtok');
    if(inp && inp.value.trim()){ setPubToken(inp.value.trim()); renderList(); }
    return;
  }
  if(e.target.closest('#pubclear')){ setPubToken(''); renderList(); return; }
  if(e.target.closest('#pubtok')) return;  // typing the token must not toggle anything
  const rm = e.target.closest('[data-cprm]');
  if(rm){ cplRemove(rm.dataset.cprm, +rm.dataset.i); return; }
  const del = e.target.closest('[data-cpldel]');
  if(del){
    const id = del.dataset.cpldel;
    if(CPLDEL === id){ CPLDEL = null; cplDelete(id); }
    else { CPLDEL = id; renderList(); }
    return;
  }
  if(e.target.closest('#cplnew')){ CPICK = { create: true }; renderSheet(); return; }
  if(e.target.closest('#rcpnew')){ recipeOpen(null); return; }
  if(e.target.closest('#reshuffle')){ reshuffleMix(); return; }
  if(e.target.closest('#mixscores')){ toggleMixScores(); return; }
  if(e.target.closest('#mixlimit')) return;  // typing a limit must not fold the card
  const ml = e.target.closest('[data-mixlimit]');
  if(ml){ setMixLimit(+ml.dataset.mixlimit); return; }
  const re = e.target.closest('[data-rcpedit]');
  if(re){ recipeOpen(re.dataset.rcpedit); return; }
  const rd = e.target.closest('[data-rcpdel]');
  if(rd){
    const key = 'r:' + rd.dataset.rcpdel;
    if(CPLDEL === key){ CPLDEL = null; recipeDelete(rd.dataset.rcpdel); }
    else { CPLDEL = key; renderList(); }
    return;
  }
  const pc = e.target.closest('[data-plc]');
  if(pc){
    PLOPEN = PLOPEN === pc.dataset.plc ? null : pc.dataset.plc;
    if(PLOPEN) plLoad(PLOPEN);  // a recipe preview reads only the albums that can make its cut
    renderList(); return;
  }
  const btn = e.target.closest('[data-act]');
  const row = e.target.closest('.row');
  if(!row) return;
  const id = row.dataset.id;
  if(btn){
    if(btn.dataset.act === 'queue') toggleQueued(id);
    else if(btn.dataset.act === 'log') openLog(id);
    else if(btn.dataset.act === 'like') toggleLiked(id);
    else if(btn.dataset.act === 'tlike') toggleTrackLike(id, btn.dataset.t);
    else if(btn.dataset.act === 'tadd') addFlow(id, btn.dataset.t);
    else if(btn.dataset.act === 'hide') hideTrack(id);
    else if(btn.dataset.act === 'restore') unhideTrack(id);
    else if(btn.dataset.act === 'listen') openTrack(byId(id));
    else if(btn.dataset.act === 'album') openAlbum(id);
    else if(btn.dataset.act === 'mood') openMoodFeed(btn.dataset.mood);
    return;
  }
  if(row.classList.contains('song')){
    const r = byId(id);
    if(r){
      const f = fold(row.dataset.t);
      const tr = (tracksOf(r) || []).find(x => fold(x.title) === f) || { title: row.dataset.t };
      openUrl(trackUrl(r, tr));
    }
    return;
  }
  if(!row.classList.contains('ghost')) toggleExpand(id);
});
let MIX_TIMER = 0;

  S.mixLimit = n; save();
  document.querySelectorAll('#list [data-mixlimit]').forEach(b => b.classList.toggle('on', +b.dataset.mixlimit === n));
  clearTimeout(MIX_TIMER);
  MIX_TIMER = setTimeout(() => { plLoad('random'); renderList(); }, 600);  // redraw once the typing settles, never mid-keystroke
});
document.getElementById('list').addEventListener('keydown', e => {
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const pc = e.target.closest('[data-plc]');
  if(pc && e.target === pc){ e.preventDefault(); pc.click(); return; }
  const row = e.target.closest('.row');
  if(!row || e.target !== row) return;
  e.preventDefault();
  if(row.classList.contains('song')) row.click();
  else toggleExpand(row.dataset.id);
