const sheetwrap = document.getElementById('sheetwrap');
sheetwrap.addEventListener('click', e => {
  if(CSHEET === 'rgenre'){
    // a pick, the back row, or the scrim all return to the recipe sheet
    const rg = e.target.closest('[data-shrg]');
    if(rg) RDRAFT.rec.genre[recipeMedium(RDRAFT.rec) === 'game' ? 'game' : 'screen'] = rg.dataset.shrg;
    if(rg || e.target.id === 'scrim' || e.target.closest('#shback')){ CSHEET = 'recipe'; renderSheet(); }
    return;
  }
  if(CSHEET === 'rmood'){
    // a pick toggles in place; the back row or the scrim return to the recipe
    const rm = e.target.closest('[data-shrm]');
    if(rm){ recipeToggleMood(rm.dataset.shrm); return; }
    if(e.target.id === 'scrim' || e.target.closest('#shback')){ CSHEET = 'recipe'; renderSheet(); }
    return;
  }
  if(CSHEET === 'recipe'){
    if(e.target.id === 'scrim' || e.target.closest('#rc-cancel')){ recipeCancel(); return; }
    if(e.target.closest('#rc-save')){ recipeSave(); return; }
    if(e.target.closest('#rc-genre')){ CSHEET = 'rgenre'; renderSheet(); return; }
    if(e.target.closest('#rc-mood')){ CSHEET = 'rmood'; renderSheet(); return; }
    const sg = e.target.closest('[data-rc]');
    if(sg){ recipeSet(sg.dataset.rc, sg.dataset.v); return; }
    const tg = e.target.closest('[data-rct]');
    if(tg) recipeSet(tg.dataset.rct, !RDRAFT.rec[tg.dataset.rct]);
    return;
  }
  if(CSHEET){
    if(e.target.id === 'scrim' || e.target.closest('#shdone') || e.target.closest('#shback')){
      // a picker goes back to the sheet that opened it; anything else closes
      CSHEET = CSHEET === 'fgenre' ? 'filters' : CSHEET === 'plgpick' ? 'plgenre' : null;
      renderSheet(); return;
    }
    if(e.target.closest('#shgenrerow')){ CSHEET = 'fgenre'; renderSheet(); return; }
    const pr = e.target.closest('[data-shplgrow]');
    if(pr){ PLGBUCKET = pr.dataset.shplgrow === 'screen' ? 'screen' : 'game'; CSHEET = 'plgpick'; renderSheet(); return; }
    if(e.target.closest('#shscores')){ toggleFeedScores(); return; }
    if(e.target.closest('#shlscores')){ toggleLibScores(); return; }
    const fs = e.target.closest('[data-shsort]');
    if(fs){ CSHEET = null; setFeedSort(fs.dataset.shsort); return; }
    const ls = e.target.closest('[data-shlsort]');
    if(ls){ CSHEET = null; setLibSort(ls.dataset.shlsort); return; }
    const y = e.target.closest('[data-shyear]');
    if(y){ CSHEET = null; renderSheet(); jumpToYear(y.dataset.shyear); return; }
    const co = e.target.closest('[data-shco]');
    if(co){ setFeedCo(co.dataset.shco); return; }        // filters apply live; the sheet stays open
    if(e.target.closest('#shconsole')){ toggleFeedConsole(); return; }
    const g = e.target.closest('[data-shgenre]');
    if(g){ CSHEET = 'filters'; setFeedGenre(feedMediumEff() === 'game' ? 'game' : 'screen', g.dataset.shgenre); return; }  // a pick returns to the filters
    const m = e.target.closest('[data-shmed]');
    if(m){
      // tapping the already-on film + tv segment keeps the sub-selection
      if(!(m.dataset.shmed === 'screen' && screenish(S.feedMedium))) setFeedMedium(m.dataset.shmed);
      return;
    }
    const sub = e.target.closest('[data-shsub]');
    if(sub){ setFeedMedium(sub.dataset.shsub); return; }
    const lm = e.target.closest('[data-shlmed]');
    if(lm){
      if(!(lm.dataset.shlmed === 'screen' && screenish(S.libMedium))) setLibMedium(lm.dataset.shlmed);
      return;
    }
    const lsub = e.target.closest('[data-shlsub]');
    if(lsub){ setLibMedium(lsub.dataset.shlsub); return; }
    if(e.target.closest('#shliked')){ toggleLibLiked(); return; }
    const py = e.target.closest('[data-shplyear]');
    if(py){ CSHEET = null; setPlYear(py.dataset.shplyear); return; }
    const pgg = e.target.closest('[data-shplg-game]');
    if(pgg){ CSHEET = 'plgenre'; setPlGenre('game', pgg.dataset.shplgGame); return; }
    const pgs = e.target.closest('[data-shplg-screen]');
    if(pgs){ CSHEET = 'plgenre'; setPlGenre('screen', pgs.dataset.shplgScreen); return; }
    if(e.target.closest('#shclear')){
      if(CSHEET === 'libfilters'){
        S.libMedium = 'all'; S.libLiked = false; S.libScores = false; save(); renderAll();
      } else if(CSHEET === 'plgenre'){
        S.plGenre = { game: 'all', screen: 'all' }; save(); renderAll();
      } else clearFeedFilters();
      return;
    }
    return;
  }
  if(CPICK){
    if(e.target.id === 'scrim'){ CPICK = null; renderSheet(); return; }
    const row = e.target.closest('[data-cpick]');
    if(row){
      const id = row.dataset.cpick;
      if(CPICK.from && CPICK.from !== id) cplPull(CPICK.from, CPICK.rid, CPICK.t);  // "change" moves the save
      cplAdd(id, CPICK.rid, CPICK.t);
      return;
    }
    if(e.target.id === 'cp-create'){
      const inp = document.getElementById('cp-name');
      const p = cplNew(inp ? inp.value : '');
      if(!p) return;
      if(CPICK.rid){
        if(CPICK.from) cplPull(CPICK.from, CPICK.rid, CPICK.t);
        cplAdd(p.id, CPICK.rid, CPICK.t);  // the pending song lands in the new playlist
      } else {
        // born in the library: arm the sticky target and go pick songs
        S.cplLast = { id: p.id, at: Date.now() };
        S.view = 'feed'; save();
        CPICK = null;
        toast('adding to ' + p.name + ' — tap + on any track');
        renderAll();
      }
    }
    return;
  }
  if(e.target.id === 'scrim'){ closeLog(); return; }
  if(e.target.id === 'sh-save'){ saveLog(); return; }
  if(e.target.id === 'sh-unlog'){ clearListen(); return; }
  if(e.target.id === 'sh-clear'){ SHEET.draft.rating = null; renderSheet(); return; }
  if(e.target.id === 'sh-heart'){ SHEET.draft.liked = !SHEET.draft.liked; renderSheet(); return; }
  const star = e.target.closest('button[data-r]');
  if(star){ SHEET.draft.rating = parseFloat(star.dataset.r); renderSheet(); }
});
sheetwrap.addEventListener('input', e => {
  if(RDRAFT && CSHEET === 'recipe'){
    const rc = RDRAFT.rec, id = e.target.id;
    if(id === 'rc-name') rc.name = e.target.value.slice(0, 80);
    else if(id === 'rc-composer') rc.composer = e.target.value.slice(0, 80);
    else if(id === 'rc-from' || id === 'rc-to'){
      const v = e.target.value.replace(/\D/g, '').slice(0, 4);
      rc[id === 'rc-from' ? 'yearFrom' : 'yearTo'] = v.length === 4 ? v : '';  // a bound counts once it is a whole year
    } else if(id === 'rc-limit'){
      const n = parseInt(e.target.value.replace(/\D/g, ''), 10);
      if(!(n >= 1 && n <= RECIPE_MAX)) return;  // a half-typed or out-of-range number leaves the limit as it was
      rc.limit = n;
    } else return;
    recipeRefreshCount();
    return;
  }
  if(!SHEET) return;
  if(e.target.id === 'sh-note') SHEET.draft.note = e.target.value;
  if(e.target.id === 'sh-date') SHEET.draft.listenedOn = e.target.value;
});
document.getElementById('albumwrap').addEventListener('click', e => {
  if(e.target.closest('.aclose')){ closeAlbum(); return; }
  const mc = e.target.closest('[data-mood]');
  if(mc){ openMoodFeed(mc.dataset.mood); return; }
  const r = ALBUM && byId(ALBUM);
  const lk = e.target.closest('[data-act="tlike"]');
  if(lk && r){ toggleTrackLike(r.id, lk.dataset.t); return; }  // heart, not play
  const ad = e.target.closest('[data-act="tadd"]');
  if(ad && r){ addFlow(r.id, ad.dataset.t); return; }          // plus, not play
  const t = e.target.closest('.atrack');
  if(t && r){ const tr = shownTracks(r)[+t.dataset.i]; if(tr) openUrl(trackUrl(r, tr)); }
});
window.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(CSHEET === 'rgenre' || CSHEET === 'rmood'){ CSHEET = 'recipe'; renderSheet(); }
  else if(CSHEET === 'recipe') recipeCancel();
  else if(CSHEET === 'fgenre'){ CSHEET = 'filters'; renderSheet(); }
  else if(CSHEET === 'plgpick'){ CSHEET = 'plgenre'; renderSheet(); }
  else if(CSHEET){ CSHEET = null; renderSheet(); }
  else if(CPICK){ CPICK = null; renderSheet(); }
  else if(SHEET) closeLog();
  else if(ALBUM) closeAlbum();
});
let SHEET_Y0 = null;
sheetwrap.addEventListener('touchstart', e => {
  // control sheets and the picker dismiss on swipe; the logging sheet and
  // the recipe sheet (with its genre and mood pickers) never do, because a
  // stray drag there would discard the draft. A swipe that starts inside a
  // scrolled list is a scroll, not a dismiss.
  const body = e.target.closest('.shbody');
  SHEET_Y0 = (CSHEET || CPICK) && !['recipe', 'rgenre', 'rmood'].includes(CSHEET) && e.target.closest('#sheet') && !(body && body.scrollTop > 0)
    ? e.touches[0].clientY : null;
}, { passive: true });
sheetwrap.addEventListener('touchend', e => {
  if(SHEET_Y0 == null) return;
  const dy = e.changedTouches[0].clientY - SHEET_Y0;
  SHEET_Y0 = null;
  if(dy <= 60) return;
  if(CSHEET){ CSHEET = null; renderSheet(); }
  else if(CPICK){ CPICK = null; renderSheet(); }
}, { passive: true });
document.getElementById('toastwrap').addEventListener('click', e => {
  if(e.target.id !== 'toast-change' || !TOAST || !TOAST.song) return;
  CPICK = { rid: TOAST.song.rid, t: TOAST.song.t, from: TOAST.song.from };
  TOAST = null; clearTimeout(TOAST_TIMER);
  renderToast(); renderSheet();
});
const MAIN_EL = document.querySelector('main');
MAIN_EL.addEventListener('scroll', () => {
  // one screen of scroll earns the shortcut back up
  document.getElementById('totop').hidden = MAIN_EL.scrollTop <= MAIN_EL.clientHeight;
}, { passive: true });
document.getElementById('totop').addEventListener('click', () => {
  if(MAIN_EL.scrollTo) MAIN_EL.scrollTo({ top: 0, behavior: motionOk() ? 'smooth' : 'auto' });
  else MAIN_EL.scrollTop = 0;
});

/* ======================= backup lifeboat ======================= */
function buildExport(){ return { app: 'scorekeep', exportedAt: new Date().toISOString(), state: S }; }
function exportBackup(){
  try{
    const blob = new Blob([JSON.stringify(buildExport(), null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'scorekeep-backup-' + todayLocal() + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }catch(e){}
}
function applyImport(text){
  let d = null;
  try{ d = JSON.parse(text); }catch(e){ return false; }
  const s = validateState(d && d.state ? d.state : d);
  if(!s) return false;
  S = s; save(); renderAll();
  return true;
}

/* ============================ boot ============================= */
renderAll();
fetch('data/releases.json', { cache: 'no-store' })
  .then(resp => { if(!resp.ok) throw new Error('HTTP ' + resp.status); return resp.json(); })
  .then(data => {
    if(!data || !Array.isArray(data.releases)) throw new Error('bad shape');
    R = data;
    buildIndexes();
    LOADSTATE = R.releases.length ? 'ok' : 'empty';
    ensureViewTracks();  // landing straight on liked songs or playlists needs its files
    renderAll();
    markVisit();  // after render: this visit's NEW badges compare against the previous visit
  })
  .catch(err => { LOADSTATE = 'error'; LOADERR = err.message; renderAll(); });
</script>
